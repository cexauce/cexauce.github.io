# Overrides applied on top of _config.yml by .github/workflows/deploy.yml.
# Keeps the al-folio sample posts available to local builds and integration tests,
# but out of the published site.

external_sources: []

# Jekyll replaces this list instead of merging it, so it repeats the exclude list from _config.yml.
exclude:
  - al-folio-upgrade-report.md
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - readme_preview/
  - gems/
  - migrations/
  - vendor
  # al-folio sample posts used by the integration tests
  - _posts/
  # repo files
  - AGENTS.md
  - CLAUDE.md
  - requirements.txt
  - test/
